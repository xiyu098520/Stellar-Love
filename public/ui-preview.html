<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>UI 样板 · 三款</title>
<style>
  :root{
    --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; background:#05070b; color:#e8ecf5; font-family:var(--sans); }
  body{ -webkit-font-smoothing:antialiased; }

  .top{
    position:sticky; top:0; z-index:30;
    display:flex; gap:16px; align-items:center; justify-content:space-between;
    padding:14px 22px; flex-wrap:wrap;
    background:rgba(5,7,11,.92); border-bottom:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
  }
  .top .brand{ font-size:12px; letter-spacing:.18em; color:#aab3c6; }
  .switch{ display:flex; gap:6px; flex-wrap:wrap; }
  .switch button{
    padding:8px 13px; border:1px solid rgba(255,255,255,.14); background:transparent;
    color:#98a2b6; font:12px var(--sans); border-radius:999px; cursor:pointer;
  }
  .switch button.on{ background:#e8ecf5; border-color:#e8ecf5; color:#0a0e17; }

  .note{
    max-width:1180px; margin:0 auto; padding:14px 22px 0;
    font-size:12px; line-height:1.9; color:#7e889c;
  }

  .theme{ display:none; }
  .theme.show{ display:block; }
  .frames{
    display:flex; gap:30px; justify-content:center; align-items:flex-start;
    padding:22px; flex-wrap:wrap;
  }
  .frame-wrap{ display:flex; flex-direction:column; gap:10px; align-items:center; }
  .frame-label{
    font-size:10px; letter-spacing:.24em; color:#78829a; text-transform:uppercase;
  }

  .phone{
    width:min(360px, calc(100vw - 40px));
    aspect-ratio:9 / 19.5;
    position:relative; overflow:hidden;
    border-radius:38px;
    border:1px solid var(--line);
    background:var(--bg);
    box-shadow:0 30px 70px rgba(0,0,0,.55);
    color:var(--ink);
  }
  .phone::before{
    content:""; position:absolute; top:8px; left:50%; transform:translateX(-50%);
    width:84px; height:24px; border-radius:14px; background:#000; z-index:20;
  }

  .screen{
    position:absolute; inset:0; display:flex; flex-direction:column;
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:var(--sans);
  }
  .scroll{ flex:1; overflow-y:auto; padding:0 20px 26px; scrollbar-width:none; }
  .scroll::-webkit-scrollbar{ display:none; }

  .status{
    height:42px; flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; font-size:10px; color:var(--muted); letter-spacing:.08em;
  }
  .status .sig{ display:flex; gap:4px; align-items:flex-end; }
  .status .sig i{ display:block; width:3px; background:currentColor; border-radius:1px; }
  .status .sig i:nth-child(1){ height:4px; }
  .status .sig i:nth-child(2){ height:7px; }
  .status .sig i:nth-child(3){ height:10px; }
  .status .sig i:nth-child(4){ height:13px; }
  .status .bat{ margin-left:8px; width:18px; height:9px; border:1px solid currentColor; border-radius:2px; position:relative; }
  .status .bat::after{ content:""; position:absolute; inset:1px 5px 1px 1px; background:currentColor; border-radius:1px; }

  /* ---------- 大厅 ---------- */
  .lobby-body{ flex:1; overflow-y:auto; padding:6px 20px 14px; scrollbar-width:none; }
  .lobby-body::-webkit-scrollbar{ display:none; }
  .eyebrow{ font-size:9px; letter-spacing:.4em; color:var(--accent2); }
  h1{
    font-family:var(--serif); font-weight:500; font-size:34px;
    letter-spacing:.08em; margin:10px 0 8px; color:var(--ink);
  }
  .tagline{ font-size:11px; letter-spacing:.16em; color:var(--muted); margin:0; }
  .progress{
    display:flex; justify-content:space-between; gap:10px;
    font-size:10px; color:var(--dim); margin:20px 0 10px;
  }
  .continue{
    width:100%; height:50px; border:0; border-radius:12px;
    background:linear-gradient(120deg, var(--accent), var(--accent2));
    color:#061018; font:600 13px var(--sans); letter-spacing:.1em;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; margin-bottom:16px; cursor:pointer;
  }
  .lead-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .lead{
    display:flex; align-items:center; gap:10px; padding:12px;
    border:1px solid var(--line); border-radius:12px; background:var(--panel);
  }
  .ava{
    width:38px; height:38px; flex:none; border-radius:50%;
    display:grid; place-items:center; border:1px solid var(--line);
    background:rgba(255,255,255,.03); color:var(--accent2);
    font-family:var(--serif); font-size:15px;
  }
  .lead b{ display:block; font-size:13px; font-weight:600; letter-spacing:.06em; }
  .lead small{ display:block; font-size:9px; color:var(--muted); margin-top:3px; letter-spacing:.04em; }
  .score{ margin-left:auto; font-size:11px; color:var(--accent); }
  .quick{ display:flex; gap:8px; margin-top:12px; }
  .quick button{
    position:relative; flex:1; height:38px; border:1px solid var(--line);
    border-radius:10px; background:transparent; color:var(--muted);
    font:11px var(--sans); letter-spacing:.08em; cursor:pointer;
  }
  .quick em{
    position:absolute; top:-5px; right:9px; font-style:normal; font-size:9px;
    padding:1px 5px; border-radius:8px; background:var(--gold); color:#12100a;
  }
  .tabbar{
    flex:none; display:flex; padding:10px 0 18px;
    border-top:1px solid var(--line); background:var(--bar);
  }
  .tabbar span{ flex:1; text-align:center; font-size:9px; color:var(--dim); letter-spacing:.12em; }
  .tabbar span.on{ color:var(--accent); }
  .tabbar i{ display:block; width:15px; height:15px; margin:0 auto 5px; border:1px solid currentColor; border-radius:4px; }

  /* ---------- 设定 ---------- */
  .topbar{
    height:52px; flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:0 18px; border-bottom:1px solid var(--line);
    font-size:12px; color:var(--muted);
  }
  .topbar b{ font-size:14px; font-weight:500; color:var(--ink); letter-spacing:.14em; }
  .topbar .save{ color:var(--accent2); }
  .tabs{ flex:none; display:flex; gap:6px; padding:12px 16px 4px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tabs span{
    flex:none; padding:7px 12px; font-size:10px; letter-spacing:.1em;
    color:var(--dim); border:1px solid transparent; border-radius:999px;
  }
  .tabs span.on{ color:var(--ink); border-color:var(--line); background:var(--panel); }
  .field{ display:block; margin-top:16px; font-size:10px; letter-spacing:.14em; color:var(--muted); }
  .field input, .field textarea{
    display:block; width:100%; margin-top:7px;
    padding:12px 13px; border:1px solid var(--line); border-radius:10px;
    background:var(--field); color:var(--ink); font:13px var(--sans);
    outline:none; letter-spacing:.02em;
  }
  .field textarea{ resize:none; line-height:1.75; }
  .hint{ font-size:10px; line-height:1.8; color:var(--dim); margin:8px 0 0; }
  .section{
    font-family:var(--serif); font-size:15px; letter-spacing:.16em;
    color:var(--ink); margin:28px 0 0; padding-bottom:9px;
    border-bottom:1px solid var(--line);
  }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .money{
    display:flex; align-items:baseline; gap:10px; margin-top:10px; padding:14px;
    border:1px solid var(--line); border-radius:12px; background:var(--panel);
  }
  .money span{ font-size:11px; color:var(--muted); letter-spacing:.1em; }
  .money b{ font-family:var(--serif); font-size:23px; font-weight:500; color:var(--accent2); }
  .money small{ margin-left:auto; font-size:9px; color:var(--dim); }
  .primary{
    width:100%; height:46px; margin-top:24px; border:0; border-radius:12px;
    background:var(--accent); color:#081018;
    font:600 12px var(--sans); letter-spacing:.2em; cursor:pointer;
  }

  /* ---------- 对话 ---------- */
  .scene{ flex:none; display:flex; gap:6px; flex-wrap:wrap; padding:10px 16px 4px; }
  .scene span{
    font-size:9px; color:var(--muted); letter-spacing:.08em;
    padding:4px 8px; border:1px solid var(--line); border-radius:999px; background:var(--panel);
  }
  .chat{
    flex:1; overflow-y:auto; padding:12px 18px 10px;
    display:flex; flex-direction:column; gap:15px; scrollbar-width:none;
  }
  .chat::-webkit-scrollbar{ display:none; }
  .narr{ font-size:12px; line-height:2; color:var(--muted); letter-spacing:.04em; }
  .say{ padding:14px; border:1px solid var(--line); border-radius:14px; background:var(--panel); }
  .say.me{ background:transparent; border-style:dashed; }
  .who{
    display:flex; align-items:center; gap:8px; margin-bottom:8px;
    font-family:var(--serif); font-size:11px; letter-spacing:.16em; color:var(--accent2);
  }
  .who .sp{ margin-left:auto; display:flex; gap:6px; }
  .who .ico{
    width:22px; height:22px; border:1px solid var(--line); border-radius:50%;
    display:grid; place-items:center; background:transparent; color:var(--dim);
    font-size:9px; cursor:pointer;
  }
  .say p{
    margin:0; font-family:var(--serif); font-size:14px; line-height:1.9;
    color:var(--ink); letter-spacing:.03em;
  }
  .choices{ flex:none; display:flex; flex-direction:column; gap:7px; padding:0 16px 8px; }
  .choices button{
    text-align:left; padding:11px 14px; border:1px solid var(--line); border-radius:10px;
    background:var(--panel); color:var(--ink); font:11px/1.65 var(--sans);
    letter-spacing:.03em; cursor:pointer;
  }
  .choices button:first-child{ border-color:var(--accent); color:var(--accent2); }
  .composer{
    flex:none; display:flex; align-items:center; gap:8px;
    padding:10px 14px 18px; border-top:1px solid var(--line); background:var(--bar);
  }
  .composer .plus{
    width:30px; height:30px; flex:none; border:1px solid var(--line); border-radius:50%;
    display:grid; place-items:center; color:var(--muted); font-size:15px;
  }
  .composer input{
    flex:1; min-width:0; height:34px; border:0; background:transparent;
    color:var(--ink); font:12px var(--sans); outline:none; letter-spacing:.03em;
  }
  .composer button{
    height:32px; padding:0 15px; border:0; border-radius:8px;
    background:var(--accent); color:#081018; font:600 11px var(--sans); cursor:pointer;
  }

  /* ================= A 夜色霓虹 ================= */
  .theme-a{
    --bg:#070A12; --panel:rgba(255,255,255,.045); --field:rgba(255,255,255,.035);
    --line:rgba(140,180,255,.16); --ink:#E9EEF8; --muted:#8D97AC; --dim:#5E687C;
    --gold:#D9B87C; --accent:#6FA8FF; --accent2:#6FE3D0; --bar:rgba(7,10,18,.94);
  }
  .theme-a .screen{
    background:
      radial-gradient(120% 55% at 12% 0%, rgba(86,132,255,.20), transparent 62%),
      radial-gradient(90% 45% at 100% 8%, rgba(70,220,200,.10), transparent 60%),
      linear-gradient(180deg, #0A0F1C 0%, #070A12 58%, #05070D 100%);
  }

  /* ================= B 夜金 ================= */
  .theme-b{
    --bg:#120E0B; --panel:rgba(255,246,230,.035); --field:rgba(255,246,230,.028);
    --line:rgba(216,183,122,.20); --ink:#F4E9D7; --muted:#B7A78E; --dim:#7E7160;
    --gold:#D8B77A; --accent:#C9A86A; --accent2:#F0D9A8; --bar:#120E0B;
  }
  .theme-b .screen{
    background:
      radial-gradient(100% 50% at 50% 0%, rgba(216,183,122,.14), transparent 65%),
      radial-gradient(140% 90% at 50% 110%, rgba(0,0,0,.55), transparent 60%),
      linear-gradient(180deg, #16100C 0%, #120E0B 55%, #0D0A08 100%);
  }

  /* ================= C 纸感 ================= */
  .theme-c{
    --bg:#F5EFE5; --panel:#FFFDF9; --field:#FFFDF9;
    --line:rgba(86,68,44,.14); --ink:#2B2621; --muted:#7C7062; --dim:#A29584;
    --gold:#A9874F; --accent:#8A6A3B; --accent2:#A9874F; --bar:#FBF6EC;
  }
  .theme-c .phone{ box-shadow:0 30px 70px rgba(60,45,20,.28); }
  .theme-c .screen{
    background:
      linear-gradient(180deg, rgba(255,255,255,.4), transparent 40%),
      repeating-linear-gradient(0deg, rgba(120,95,60,.025) 0 1px, transparent 1px 4px),
      linear-gradient(180deg, #F8F3EA 0%, #F2EADD 100%);
  }

  /* ---------- 三款的不同气质 ---------- */
  .theme-b .lobby-head{ text-align:center; padding-top:22px; }
  .theme-b .lobby-head .eyebrow::before,
  .theme-b .lobby-head .eyebrow::after{
    content:""; display:inline-block; width:26px; height:1px;
    background:var(--line); vertical-align:middle; margin:0 8px;
  }
  .theme-b h1{ font-size:36px; letter-spacing:.14em; }
  .theme-b .tagline{ letter-spacing:.22em; }
  .theme-b .continue{
    border-radius:2px; background:var(--gold); color:#1C130B;
    font-family:var(--serif); letter-spacing:.22em;
  }
  .theme-b .lead-grid{ grid-template-columns:1fr; gap:0; border-top:1px solid var(--line); }
  .theme-b .lead{
    border:0; border-bottom:1px solid var(--line); border-radius:0;
    background:transparent; padding:14px 4px;
  }
  .theme-b .ava{ width:32px; height:44px; border-radius:2px; font-size:14px; }
  .theme-b .quick button{ border-radius:2px; }
  .theme-b .field input, .theme-b .field textarea{ border-radius:2px; }
  .theme-b .money, .theme-b .tabs span.on{ border-radius:2px; }
  .theme-b .primary{
    border-radius:2px; background:var(--gold); color:#1C130B;
    font-family:var(--serif); letter-spacing:.26em;
  }
  .theme-b .tabs span{ border-radius:0; }
  .theme-b .scene span{ border-radius:2px; }
  .theme-b .say{
    border:0; border-left:1px solid var(--line); border-radius:0;
    background:transparent; padding:2px 0 2px 14px;
  }
  .theme-b .say.me{ border-left-style:dashed; opacity:.88; }
  .theme-b .choices button{ border-radius:2px; background:transparent; }
  .theme-b .choices button:first-child{ background:rgba(216,183,122,.08); }
  .theme-b .composer button, .theme-b .composer .plus{ border-radius:2px; }

  .theme-c .lobby-head{ padding-top:26px; border-bottom:1px solid var(--line); padding-bottom:18px; }
  .theme-c h1{ font-size:38px; letter-spacing:.1em; }
  .theme-c .lead-grid{ display:block; }
  .theme-c .lead{
    border:0; border-bottom:1px solid var(--line); border-radius:0;
    background:transparent; padding:15px 0;
  }
  .theme-c .lead-grid .lead:first-child{ border-top:1px solid var(--line); margin-top:10px; }
  .theme-c .ava{ border-radius:2px; background:#FBF3E4; }
  .theme-c .continue{ background:#2B2621; color:#F8F3EA; border-radius:3px; }
  .theme-c .quick button{ border-radius:3px; background:#FFFDF9; }
  .theme-c .tabbar i{ border-radius:2px; }
  .theme-c .field input, .theme-c .field textarea{ border-radius:4px; }
  .theme-c .tabs span{ border-radius:2px; }
  .theme-c .tabs span.on{ background:#FFFDF9; }
  .theme-c .money{ border-radius:4px; box-shadow:0 6px 18px rgba(80,60,30,.05); }
  .theme-c .primary{ background:#2B2621; color:#F8F3EA; border-radius:3px; }
  .theme-c .scene span{ border-radius:2px; background:#FFFDF9; }
  .theme-c .say{
    border-radius:4px; background:#FFFDF9; border-color:rgba(86,68,44,.1);
    box-shadow:0 8px 22px rgba(90,65,30,.07);
  }
  .theme-c .say.me{ background:#FBF6EC; border-style:dashed; }
  .theme-c .choices button{ border-radius:3px; background:#FFFDF9; }
  .theme-c .choices button:first-child{ background:#FBF3E4; border-color:#B48F52; color:#6E5127; }
  .theme-c .composer button{ border-radius:3px; }
</style>
</head>
<body>

<div class="top">
  <div class="brand">UI 样板 · 同一内容，三款皮肤</div>
  <div class="switch">
    <button data-t="a" class="on">A 夜色霓虹</button>
    <button data-t="b">B 夜金</button>
    <button data-t="c">C 纸感</button>
  </div>
</div>

<div class="note">
  每款都含三屏：大厅、剧本设定、主线对话。名字、身份、数值都是占位，只看气质和手感。
  样板的标题字用宋体近似，正式版是 KingHwa OldSong。
</div>

<section class="theme theme-a show" id="theme-a"></section>
<section class="theme theme-b" id="theme-b"></section>
<section class="theme theme-c" id="theme-c"></section>

<template id="tpl">
  <div class="frames">

    <!-- 大厅 -->
    <div class="frame-wrap">
      <div class="frame-label">01 · 大厅</div>
      <div class="phone">
        <div class="screen">
          <div class="status">
            <span>15:43</span>
            <span class="sig"><i></i><i></i><i></i><i></i><span class="bat"></span></span>
          </div>
          <div class="lobby-body">
            <div class="lobby-head">
              <div class="eyebrow">STELLAR LOVE</div>
              <h1>星轨之下</h1>
              <p class="tagline">高科技都市 · 普通恋爱生活</p>
            </div>

            <div class="progress">
              <span>主线 · 第 1 部</span>
              <span>9月12日 22:40 · 12 回合</span>
            </div>

            <button class="continue">继续主线 <span>1-2</span></button>

            <div class="lead-grid">
              <div class="lead">
                <span class="ava">砂</span>
                <div><b>砂金</b><small>旧街赌场</small></div>
                <span class="score">30</span>
              </div>
              <div class="lead">
                <span class="ava">日</span>
                <div><b>星期日</b><small>第七码头</small></div>
                <span class="score">12</span>
              </div>
              <div class="lead">
                <span class="ava">景</span>
                <div><b>景元</b><small>天文台</small></div>
                <span class="score">6</span>
              </div>
              <div class="lead">
                <span class="ava">白</span>
                <div><b>白厄</b><small>夜班诊所</small></div>
                <span class="score">0</span>
              </div>
            </div>

            <div class="quick">
              <button>手机 <em>2</em></button>
              <button>背包</button>
              <button>账本</button>
            </div>
          </div>

          <nav class="tabbar">
            <span class="on"><i></i>大厅</span>
            <span><i></i>背包</span>
            <span><i></i>手机</span>
            <span><i></i>设定</span>
          </nav>
        </div>
      </div>
    </div>

    <!-- 设定 -->
    <div class="frame-wrap">
      <div class="frame-label">02 · 剧本设定</div>
      <div class="phone">
        <div class="screen">
          <div class="status">
            <span>15:43</span>
            <span class="sig"><i></i><i></i><i></i><i></i><span class="bat"></span></span>
          </div>
          <div class="topbar">
            <span>返回</span>
            <b>设定剧本</b>
            <span class="save">保存</span>
          </div>

          <div class="tabs">
            <span class="on">基础</span>
            <span>世界观</span>
            <span>玩法</span>
            <span>事件</span>
            <span>文风</span>
          </div>

          <div class="scroll">
            <label class="field">剧本名
              <input value="星轨之下" />
            </label>

            <label class="field">一句话
              <input value="高科技都市里的普通恋爱" />
            </label>

            <div class="two">
              <label class="field">开局日期
                <input value="2065-09-12" />
              </label>
              <label class="field">开局时刻
                <input value="08:00" />
              </label>
            </div>
            <p class="hint">会从 2065年9月12日 上午 8:00 开始。</p>

            <div class="section">世界观</div>

            <label class="field">货币系统
              <input value="星币 · 1 星币约等于 10 元" />
            </label>

            <label class="field">禁忌
              <textarea rows="3">不写死亡，不写强制，不替她做决定。</textarea>
            </label>

            <div class="section">钱包</div>

            <div class="money">
              <span>初始资金</span>
              <b>5,000</b>
              <small>不设上限</small>
            </div>
            <p class="hint">从 5,000 起，之后剧情里赚多少都进这里；主线和个人线共用。</p>

            <button class="primary">保存剧本</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 对话 -->
    <div class="frame-wrap">
      <div class="frame-label">03 · 主线对话</div>
      <div class="phone">
        <div class="screen">
          <div class="status">
            <span>15:43</span>
            <span class="sig"><i></i><i></i><i></i><i></i><span class="bat"></span></span>
          </div>
          <div class="topbar">

<script>
  const tpl = document.getElementById('tpl');
  document.querySelectorAll('.theme').forEach(t => {
    t.appendChild(tpl.content.cloneNode(true));
  });

  const btns = Array.from(document.querySelectorAll('.switch button'));
  btns.forEach(b => {
    b.onclick = () => {
      btns.forEach(x => x.classList.toggle('on', x === b));
      document.querySelectorAll('.theme').forEach(t => {
        t.classList.toggle('show', t.id === 'theme-' + b.dataset.t);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
  });
</script>
